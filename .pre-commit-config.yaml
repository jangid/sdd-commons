# Pre-commit gate for the SDD toolkit — docs/spec/pre-commit.md.
#
# The gate is a runner, not a source of policy: every hook below is either one
# of the repository's own two maintenance tools or one of four upstream file
# hygiene hooks. No hook enforces a rule that is not already stated in a
# requirement, a skill, or one of the two tools' own rule tables.
#
# Excluded areas, each pattern carrying its reason on its own line. The
# exclusion list is written as a verbose (?x) regex so that each pattern can sit
# on its own line beside its reason — see Q-IMPL-MARKETPLACE-009 in
# docs/spec/pre-commit.md.
exclude: |
  (?x)^(
      plugins/sdd/tools/fixtures/   # frozen fixtures whose bytes are part of what they test — normalising one would change what the fixture proves while leaving every test green
    | docs/superpowers/    # vendored third-party corpus, not this repository's text to normalise
    | docs/ws/             # execution records of closed cycles — a rewrite makes the record disagree with the commits it describes; the active workstream is excluded with them so the gate does not rewrite a plan mid-cycle
    | docs/research/       # historical execution records of closed cycles — a rewrite makes the record disagree with the commits it describes
  )

repos:
  # The repository's own two whole-corpus sweeps. Both are invoked once per
  # commit over the whole repository, never once per changed file: each tool's
  # findings are cross-file, so a per-file invocation would both mis-report and
  # multiply the cost by the number of staged files.
  - repo: local
    hooks:
      - id: drift-sweep
        name: drift sweep (fast profile)
        entry: python3 plugins/sdd/tools/gc.py --fast
        language: system
        pass_filenames: false
        always_run: true
      - id: skill-lint
        name: skill linter
        entry: python3 plugins/sdd/tools/skill-lint.py
        language: system
        pass_filenames: false
        always_run: true

      # Both tools' own self-tests, added at implement-stage review round 2 and
      # made part of the closed hook set at round 3 — REQ-PC-MARKETPLACE-001 is
      # amended to eight entries, docs/spec/pre-commit.md §Hook-Set Amendment.
      # They are NOT among the three heavier self-tests REQ-PC-MARKETPLACE-004
      # keeps out of the gate: that requirement's acceptance greps this file
      # for the script filenames of three OTHER contributor tools (the
      # scope-check, the telemetry and the evaluation tools — their filenames
      # deliberately not spelled here), and neither entry below runs one of
      # them. The reason they belong here: the
      # corpus sweeps above exercise no two-root fixture geometry, so a wrong
      # root binding stays green in both of them, and `gc.py` embeds the
      # linter, so a linter change can turn `gc.py --self-test` red while
      # every other gate passes. That happened twice in one cycle.
      - id: skill-lint-self-test
        name: skill linter self-test
        entry: python3 plugins/sdd/tools/skill-lint.py --self-test
        language: system
        pass_filenames: false
        always_run: true
      - id: drift-sweep-self-test
        name: drift sweep self-test
        entry: python3 plugins/sdd/tools/gc.py --self-test
        language: system
        pass_filenames: false
        always_run: true

  # Upstream file hygiene. check-json in particular guards the two manifests,
  # which are the only files in the repository whose parseability the install
  # depends on.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
